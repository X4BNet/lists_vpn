name: Build Database Update
on:
  push:
    paths:
    - 'input/**'
    - 'build-local.sh'
    - 'helpers/**'
    - 'tests/**'
    - '.github/workflows/build-list.yml'
  schedule:
    - cron:  '45 8 * * *'
  workflow_dispatch:

jobs:
  build_and_commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test builder
      run: |
        bash -n ./build-local.sh
        python3 -m unittest discover -s tests -p 'test_*.py'
    - name: Build IPv4 and IPv6 lists
      run: |
        ./build-local.sh --family all --list all --output-dir .generated-output
    - name: Validate IPv4 lists
      run: |
        python3 ./helpers/asn_to_cidr.py validate --family 4 --input .generated-output/vpn/ipv4.txt --min-addresses 2000000 --max-addresses 4000000
        python3 ./helpers/asn_to_cidr.py validate --family 4 --input .generated-output/datacenter/ipv4.txt --min-addresses 250000000 --max-addresses 400000000
    - name: Validate IPv6 lists
      run: |
        python3 ./helpers/asn_to_cidr.py validate --family 6 --input .generated-output/vpn/ipv6.txt --require-nonempty
        python3 ./helpers/asn_to_cidr.py validate --family 6 --input .generated-output/datacenter/ipv6.txt --require-nonempty
    - name: Publish VPN IPv4 output
      uses: X4BNet/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }}
      with:
        source_file: '.generated-output/vpn/ipv4.txt'
        destination_repo: '${{ github.repository }}'
        destination_folder: '/output/vpn/'
        user_email: 'automated@x4b.net'
        user_name: 'listbuilder'
        destination_branch: "main"
    - name: Publish datacenter IPv4 output
      uses: X4BNet/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }}
      with:
        source_file: '.generated-output/datacenter/ipv4.txt'
        destination_repo: '${{ github.repository }}'
        destination_folder: '/output/datacenter/'
        user_email: 'automated@x4b.net'
        user_name: 'listbuilder'
        destination_branch: "main"
    - name: Publish VPN IPv6 output
      uses: X4BNet/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }}
      with:
        source_file: '.generated-output/vpn/ipv6.txt'
        destination_repo: '${{ github.repository }}'
        destination_folder: '/output/vpn/'
        user_email: 'automated@x4b.net'
        user_name: 'listbuilder'
        destination_branch: "main"
    - name: Publish datacenter IPv6 output
      uses: X4BNet/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }}
      with:
        source_file: '.generated-output/datacenter/ipv6.txt'
        destination_repo: '${{ github.repository }}'
        destination_folder: '/output/datacenter/'
        user_email: 'automated@x4b.net'
        user_name: 'listbuilder'
        destination_branch: "main"
    - name: Publish IPv4 legacy alias
      uses: X4BNet/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }}
      with:
        source_file: '.generated-output/ipv4.txt'
        destination_repo: '${{ github.repository }}'
        destination_folder: '/'
        user_email: 'automated@x4b.net'
        user_name: 'listbuilder'
        destination_branch: "main"
    - name: Publish IPv6 legacy alias
      uses: X4BNet/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }}
      with:
        source_file: '.generated-output/ipv6.txt'
        destination_repo: '${{ github.repository }}'
        destination_folder: '/'
        user_email: 'automated@x4b.net'
        user_name: 'listbuilder'
        destination_branch: "main"


